plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.seekora'
version = '1.0.0'

android {
  namespace "expo.modules.floatingassistant"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled Latin-script text recognition: the model ships inside the library, so nothing is downloaded at runtime.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
